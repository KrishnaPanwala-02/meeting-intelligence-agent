# Production overrides. Use together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from the development setup:
#   - runs the code baked into the image (no source bind mount, no --reload)
#   - databases are not published on the host at all
#   - API docs are off unless ENABLE_DOCS=true
#   - temporary upload files live in a tmpfs, not on the host
services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []

  api:
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-1} --proxy-headers
    environment:
      - ENABLE_DOCS=${ENABLE_DOCS:-false}
    volumes: !override
      - audio_data:/data/audio
      - model_cache:/root/.cache
    tmpfs:
      - /tmp

  celery-worker:
    volumes: !override
      - audio_data:/data/audio
      - model_cache:/root/.cache
    tmpfs:
      - /tmp
