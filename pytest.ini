[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

addopts =
    --strict-markers
    --cov=src
    --cov-report=term-missing:skip-covered
    --cov-fail-under=80

markers =
    asyncio: async test
    integration: needs real services (PostgreSQL, Ollama, Whisper/Pyannote); skipped when unavailable
    e2e: needs a running deployment (set E2E_BASE_URL); skipped otherwise
