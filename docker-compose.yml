version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: meeting_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/meeting_intelligence
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - ./tmp:/tmp
    working_dir: /app

  celery-worker:
    build: .
    command: celery -A src.workers.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/meeting_intelligence
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - ./tmp:/tmp
    working_dir: /app

volumes:
  postgres_data:
  redis_data:
